# electron-builder 26 uses cache modes introduced in @electron/get 3.1.
overrides:
  'app-builder-lib>@electron/get': 3.1.0
  # MCP SDK needs zod/v3 and zod/v4-mini, absent from shadcn's older resolution.
  'shadcn>zod': 3.25.76
allowBuilds:
  electron-winstaller: false
  node-pty: true
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - electron@44.8.0
  - jsdom@30.1.3
  - lucide-react@1.58.0
  - vitest@5.0.5
