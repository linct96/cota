<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tray-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
  </defs>
  <!-- 紧凑圆角深色底座 (56x56, rx=13) -->
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#tray-bg)" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="12.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />
  <!-- 外层科塔娜开口科技环 -->
  <circle
    cx="32"
    cy="32"
    r="20.5"
    fill="none"
    stroke="#E4E4E7"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-dasharray="48.5 15.9"
    transform="rotate(-35 32 32)"
  />
  <!-- 内层科塔娜主光环 -->
  <circle
    cx="32"
    cy="32"
    r="12"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="5"
  />
  <!-- 中心能量核心 -->
  <circle cx="32" cy="32" r="3.6" fill="#FFFFFF" />
</svg>
