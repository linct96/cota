name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Common Checks
            os: ubuntu-latest
          - name: macOS Checks
            os: macos-15
          - name: Windows Checks
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Common checks
        if: runner.os == 'Linux'
        env:
          SHELL: /bin/bash
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test:unit
      - name: Test Git integration
        if: runner.os == 'Linux'
        env:
          SHELL: /bin/bash
        run: pnpm test:git
      - name: Configure Git line endings for test fixtures
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Install Fish for shell tests
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew list --versions fish || brew install fish
      - name: Test native integration
        if: runner.os != 'Linux'
        run: pnpm test:native
