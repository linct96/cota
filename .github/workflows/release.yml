name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Tag must be a semantic version such as v0.1.0."
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit on main."
            exit 1
          }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - name: Build macOS ARM64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run dist --publish never "-c.extraMetadata.version=$VERSION"
      - name: Check packaged version and Host
        run: |
          ELECTRON_RUN_AS_NODE=1 release/mac-arm64/Cota.app/Contents/MacOS/Cota -e '
            const assert = require("node:assert/strict")
            const app = require("./release/mac-arm64/Cota.app/Contents/Resources/app.asar/package.json")
            assert.equal(app.version, process.env.VERSION)
            assert.equal(process.arch, "arm64")
          '
          node scripts/host-smoke.cjs --packaged
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSET="release/Cota-${VERSION}-arm64.dmg"
          test -s "$ASSET"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --verify-tag --title "Cota $TAG" --generate-notes
          fi
