appId: dev.cota.desktop
productName: Cota
directories:
  output: release
files:
  - out/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
asar: true
asarUnpack:
  - node_modules/node-pty/**
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
  identity: '-'
  hardenedRuntime: false
artifactName: '${productName}-${version}-${arch}.${ext}'
